# cargo-deny policy. Enforced in CI (.github/workflows/ci.yml).
#
# Core rule of this project: the app has NO networking and NO telemetry.
# Any crate that can open a socket or speak HTTP/TLS is banned below.

[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained (no vulnerability). It is pulled in by egui's font stack and
    # only parses egui's bundled fonts and the Windows system font: trusted inputs.
    # Re-check when egui moves to a maintained font parser.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained only; trusted font inputs; egui dependency" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
    "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # HTTP / TLS / sockets: the app must never talk to a network.
    { name = "reqwest" },
    { name = "hyper" },
    { name = "hyper-util" },
    { name = "ureq" },
    { name = "isahc" },
    { name = "surf" },
    { name = "attohttpc" },
    { name = "curl" },
    { name = "curl-sys" },
    { name = "h2" },
    { name = "tungstenite" },
    { name = "tokio-tungstenite" },
    { name = "websocket" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "rustls" },
    { name = "tokio" },
    { name = "async-std" },
    { name = "socket2" },
    { name = "mio" },
    { name = "quinn" },
    { name = "trust-dns-resolver" },
    { name = "hickory-resolver" },
]

# Note: `webbrowser` (a dependency of egui-winit) can open a link in the user's browser,
# but only when UI code emits an open-URL command. This app's UI never does. It is not a
# network client, so it is not banned; revisit if egui-winit makes it optional.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
