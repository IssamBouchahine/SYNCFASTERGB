name: Release

on:
  push:
    tags:
      - 'v*'

# No permissions by default; the release job asks for exactly what it needs.
permissions: {}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # sign build provenance
      attestations: write   # publish build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy

      - name: Gate on the same checks as CI
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build (locked)
        run: cargo build --release --locked

      - name: Checksum
        shell: pwsh
        run: |
          Copy-Item target/release/syncfastergb.exe syncfastergb.exe
          $hash = (Get-FileHash syncfastergb.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  syncfastergb.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # GitHub only offers build attestations for public repositories (or paid plans), so
      # private test releases skip this step and public releases always run it.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: syncfastergb.exe

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            syncfastergb.exe
            SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          # tags like v0.3.0-rc1 are pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
